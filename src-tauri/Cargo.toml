[package]
name = "token-meow-client"
version = "1.0.0"
description = "TokenMeow Compute Node Client"
authors = ["TokenMeow"]
edition = "2021"

[lib]
name = "token_meow_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
subprocess = "0.2"
sysinfo = "0.33"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
chrono = "0.4"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
mlx-rs = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
